apps:
- id: "homm3"
  name: "Heroes of Might and Magic III (GOG)"
  logo: "https://raw.githubusercontent.com/selfhosted-bg/docker-homm3-gog/refs/heads/main/img/homm3_hd.png"
  url: "https://github.com/selfhosted-bg/docker-homm3-gog"
  provider: "docker"
  provider_config:
    image: "ghcr.io/selfhosted-bg/docker-homm3-gog:0.2-runtime"
    port: 3000
    nvidia_support: true
    dri3_support: true
    type: "app"
    autostart: true
    url_support: false
    open_support: false
    extensions: []
    docker_overrides:
      # We don't use 'environment' here so we don't wipe SUBFOLDER/PASSWORD
      entrypoint: ["/bin/bash", "-c", "export SELKIES_MANUAL_WIDTH=1920 SELKIES_MANUAL_HEIGHT=1080 SELKIES_IS_MANUAL_RESOLUTION_MODE=true MAX_RESOLUTION=1920x1080 SELKIES_ENCODER=x264enc-striped RESTART_APP=true; exec /init"]
