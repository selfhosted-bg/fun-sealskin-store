apps:
- id: "homm3"
  name: "Heroes of Might and Magic III (GOG)"
  logo: "https://raw.githubusercontent.com/selfhosted-bg/docker-homm3-gog/refs/heads/main/img/homm3_hd.png"
  url: "https://github.com/selfhosted-bg/docker-homm3-gog"
  provider: "docker"
  provider_config:
    image: "kuhaleyka/homm3-gog-cpmplete-hd:latest"
    port: 3000
    nvidia_support: true
    dri3_support: true
    type: "app"
    autostart: true
    url_support: false
    open_support: false
    extensions: []
    docker_overrides:
      environment:
        SELKIES_MANUAL_WIDTH: "1920"
        SELKIES_MANUAL_HEIGHT: "1080"
        MAX_RESOLUTION: "1920x1080"
        SELKIES_ENCODER: "x264enc-striped"
        SELKIES_USE_BROWSER_CURSORS: "true"